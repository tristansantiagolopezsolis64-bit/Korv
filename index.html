<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korv</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="splash">
  <h1 class="brand">Korv</h1>
  <div class="rule"></div>
  <button id="enter">Entrar</button>
</div>

<header>
  <span class="logo">KORV</span>
  <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Buscar en Korv" aria-label="Buscar en Korv"></label>
  <button class="btn pb" id="pubB">+ <span>Publicar</span></button>
  <button class="me" id="meB" aria-label="Mi cuenta"></button>
  <nav class="cats" id="cats" aria-label="Categorías" hidden></nav>
  <nav class="cats" id="subs" aria-label="Subcategorías" hidden></nav>
</header>

<main>
  <div class="hero">
    <button class="arrow p" aria-label="Anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="track" id="hero"></div>
    <button class="arrow n" aria-label="Siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></button>
    <div class="dots" id="dots"></div>
  </div>
  <div id="feed"></div>
  <div id="rows"></div>
  <div class="nores" id="nores" hidden></div>
</main>
<div id="onb" hidden><div class="ob"><form id="s0"><span class="logo">KORV</span><h1>Ingresa tu nombre de usuario</h1><p class="sub">Si ya tienes cuenta, tu sesión se cargará de inmediato</p><input id="nmI" class="fi" maxlength="30" placeholder="Nombre de usuario" autocomplete="username" required><button class="btn" type="submit">Continuar</button></form><div id="s2" hidden><span class="logo">KORV</span><h1>¿Deseas crear una cuenta con este nombre?</h1><p class="sub" id="s2t"></p><button class="btn" id="yes" type="button">Crear cuenta</button><p><button class="back" type="button" id="no">Cancelar</button></p></div><div id="s1" hidden><span class="logo">KORV</span><h1>Elige tu rol</h1><p class="sub">Define cómo usarás Korv con esta cuenta</p><div class="roles" id="rolesB"></div><p><button class="back" type="button" data-bk>Volver</button></p></div></div></div>
<div id="view" hidden tabindex="-1"></div>

<script src="js/app.js"></script>
</body>
</html>
